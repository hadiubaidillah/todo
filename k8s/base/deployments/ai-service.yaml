apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: ai-service
          image: harbor.hadiubaidillah.com/todo/ai-service:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: ai-service-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-secret
                  key: ANTHROPIC_API_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
