apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-ingress
  namespace: todo
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`todo.hadiubaidillah.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: gateway-server
          port: 8080
    - match: Host(`todo.hadiubaidillah.com`)
      kind: Rule
      services:
        - name: frontend
          port: 80
    - match: Host(`eureka.hadiubaidillah.com`)
      kind: Rule
      services:
        - name: discovery-server
          port: 8761
